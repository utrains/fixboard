services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixboard}
      POSTGRES_DB: ${POSTGRES_DB:-fixboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-fixboard}:${POSTGRES_PASSWORD:-fixboard}@postgres:5432/${POSTGRES_DB:-fixboard}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Standing in for the EFS-backed PVC this becomes on Kubernetes — the
      # app only ever knows it as "a writable directory", so the mount
      # underneath it can change later without touching any code.
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # No VITE_API_URL build-arg: the image's default (/api) is relative,
      # so it works unmodified regardless of what host/port serves it.
      # Nginx reverse-proxies /api/* to BACKEND_UPSTREAM at runtime instead.
    environment:
      BACKEND_UPSTREAM: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
